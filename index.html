    <script src="main.js" defer></script>
    <title>Produtos</title>
</head>
<body id="body">

   <table>

        <tr>
            <th>Código</th>
            <th>Produto</th>
            <th>Qntd</th>
            <th>Preço</th>
        </tr>
    </thead>
    <tbody id="tabela">

            <td>128</td>
            <td>Mouse</td>
            <td>50</td>
            <td>98,99</td>
        </tr>
    </tbody>
   </table>

</html>
